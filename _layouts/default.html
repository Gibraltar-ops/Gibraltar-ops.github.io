<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    {% comment %} ?v=<build time> makes browsers fetch the new file after every deploy instead of a cached copy {% endcomment %}
    {% assign asset_version = site.time | date: '%s' %}
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v={{ asset_version }}">
</head>
<body>

{% include header.html %}

{{ content }}

{% include footer.html %}

{% if page.url == '/' %}<script src="{{ '/js/nav.js' | relative_url }}?v={{ asset_version }}" defer></script>{% endif %}

</body>
</html>
