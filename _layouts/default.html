<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo %}
    {% comment %} ?v=<build time> makes browsers fetch the new file after every deploy instead of a cached copy {% endcomment %}
    {% assign asset_version = site.time | date: '%s' %}
    <!-- Start loading the heading font early so headings don't visibly swap font -->
    <link rel="preload" href="{{ '/fonts/chakra-petch-700.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}?v={{ asset_version }}">
</head>
<body>

<!-- Skip link: first thing keyboard users reach, jumps past the navigation (WCAG 2.4.1) -->
<a class="skip-link" href="#main">Skip to content</a>

{% include header.html %}

<!-- Main landmark: lets screen readers jump straight to the page content -->
<main id="main" tabindex="-1">
{{ content }}
</main>

{% include footer.html %}

{% if page.url == '/' %}<script src="{{ '/js/nav.js' | relative_url }}?v={{ asset_version }}" defer></script>{% endif %}

</body>
</html>
