# Site settings
title: Magnus Henry
tagline: Game Designer and Programmer
description: Game designer and programmer based in Gothenburg, Sweden. Projects in Unreal Engine, Unity and SDL3, plus a blog on multiplayer networking.
url: "https://magnushenry.se"
baseurl: ""
lang: en

author:
  name: Magnus Henry
  email: magnushenry9@gmail.com
  github: Gibraltar-ops
  linkedin: magnushenry

# Markdown: GitHub-flavoured Markdown, Rouge syntax highlighting,
# table of contents built from H2 and H3 headings.
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3

# Blog posts are served at /blog/<slug>/ (no date in the URL).
# Set as a default for posts only: a global "permalink" ending in "/"
# would also turn pages like /projects/lastkaj.html into /projects/lastkaj/.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/

# Adds <title>, description and link-preview tags (LinkedIn, Discord etc.).
plugins:
  - jekyll-seo-tag

# Files that should never be published.
exclude:
  - "*.sln"
  - .idea
  - README.md
  - MEDIA-CHECKLIST.md
