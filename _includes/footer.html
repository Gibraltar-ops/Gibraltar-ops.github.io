<!-- Contact (shared footer, id="contact" makes the nav link work on every page) -->
<footer id="contact" class="footer-section">
    <div class="contact-container">
        <h2>Contact</h2>
        <p>Email: <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
        <p>GitHub: <a href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener">github.com/{{ site.author.github }}</a></p>
        <p>LinkedIn: <a href="https://linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener">linkedin.com/in/{{ site.author.linkedin }}</a></p>
    </div>
</footer>
